<!DOCTYPE html>
<html>
<head>
<style>
body { background: #111; padding: 24px; font-family: monospace; color: #ccc; margin: 0; }
h2 { color: #0f8; margin-bottom: 20px; }
.strip-container { background: #1a2a1a; padding: 20px; display: inline-block; border: 1px solid #2a4a2a; }
.frames { display: flex; gap: 4px; }
.frame { display: flex; flex-direction: column; align-items: center; }
.frame canvas { image-rendering: pixelated; border: 1px solid #333; }
.label { color: #666; font-size: 10px; margin-top: 4px; }
.full { margin-top: 20px; background: #000; padding: 12px; display: inline-block; }
.full img { image-rendering: pixelated; image-rendering: crisp-edges; width: 1920px; max-width: 100%; }
.info { color: #555; font-size: 11px; margin-top: 12px; }
</style>
</head>
<body>
<h2>Player Sheet B — Frame Check</h2>

<p style="color:#aaa">Full strip at 5x scale:</p>
<div class="full">
  <img src="https://base44.app/api/apps/6a07d557e104123d6d54764f/files/mp/public/6a07d557e104123d6d54764f/6bf2008df_player_sheet_preview.png">
</div>

<p class="info">Frames L→R: Walk-A | Walk-B | Walk-C | Walk-D | Idle | Jump | Shoot | Dead</p>
<p class="info">Frame size: 48×64px | 8 frames | Strip: 384×64px</p>

<script>
// Also draw each frame individually with a label
const img = new Image();
img.crossOrigin = 'anonymous';
img.src = 'https://base44.app/api/apps/6a07d557e104123d6d54764f/files/mp/public/6a07d557e104123d6d54764f/6bf2008df_player_sheet_preview.png';
img.onload = () => {
  const labels = ['Walk A','Walk B','Walk C','Walk D','Idle','Jump','Shoot','Dead'];
  const container = document.createElement('div');
  container.style.cssText = 'display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;';
  const fw = img.width / 8;
  const fh = img.height;
  labels.forEach((lbl, i) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;align-items:center;';
    const c = document.createElement('canvas');
    c.width = fw; c.height = fh;
    c.style.cssText = `width:${fw}px;height:${fh}px;image-rendering:pixelated;border:1px solid #2a4a2a;background:#0a150a;`;
    c.getContext('2d').drawImage(img, i*fw, 0, fw, fh, 0, 0, fw, fh);
    const l = document.createElement('div');
    l.textContent = lbl;
    l.style.cssText = 'color:#4a8a4a;font-size:10px;margin-top:4px;font-family:monospace;';
    wrap.appendChild(c); wrap.appendChild(l);
    container.appendChild(wrap);
  });
  document.body.appendChild(container);
};
</script>
</body>
</html>
